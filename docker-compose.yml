name: oueb

# Usine one-page self-hosted. Les SITES CLIENTS sont générés en statique et
# déployés sur Cloudflare Pages (TLS + CDN mondial gérés par Cloudflare) — voir
# service `sitegen`. Ce VPS n'héberge que le CONTROL-PLANE : orchestrateur,
# emailing, CRM, kanban, LLM, scraper. Caddy expose uniquement le back-office.

x-common: &common
  restart: unless-stopped

networks:
  edge:
  internal:
    internal: true

volumes:
  caddy_data:
  caddy_config:
  n8n_data:
  pg_data:
  redis_data:
  listmonk_uploads:
  twenty_storage:
  kanboard_data:
  kanboard_plugins:

services:
  # --------------------------------------------------------------------- Caddy
  caddy:
    image: caddy:2.8-alpine
    <<: *common
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      MAIN_DOMAIN: ${MAIN_DOMAIN}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge, internal]
    depends_on: [n8n, listmonk, twenty, kanboard]

  # ----------------------------------------------------------------- PostgreSQL
  # Une instance, plusieurs bases : n8n, listmonk, twenty, kanboard (init.sql).
  postgres:
    image: postgres:16-alpine
    <<: *common
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    <<: *common
    command: ["redis-server", "--save", "60", "1"]
    volumes: [redis_data:/data]
    networks: [internal]

  # ------------------------------------------------------------------------ n8n
  n8n:
    image: n8nio/n8n:1.62.1
    <<: *common
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${PG_USER}
      DB_POSTGRESDB_PASSWORD: ${PG_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${MAIN_DOMAIN}
      N8N_PROTOCOL: https
      N8N_PATH: /n8n/
      WEBHOOK_URL: https://${MAIN_DOMAIN}/
      N8N_PROXY_HOPS: "1"
      GENERIC_TIMEZONE: Europe/Zurich
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID}
      GANDI_API_KEY: ${GANDI_API_KEY}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
      SCRAPER_TOKEN: ${SCRAPER_TOKEN}
      SITEGEN_TOKEN: ${SITEGEN_TOKEN}
      TWENTY_API_KEY: ${TWENTY_API_KEY}
      KANBOARD_API_TOKEN: ${KANBOARD_API_TOKEN}
      LISTMONK_API_USER: ${LISTMONK_API_USER}
      LISTMONK_API_TOKEN: ${LISTMONK_API_TOKEN}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n-workflows:/workflows:ro
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }

  # ------------------------------------------------------------------- Listmonk
  listmonk:
    image: listmonk/listmonk:v3.0.0
    <<: *common
    command: ["sh", "-c", "./listmonk --upgrade --yes || true; ./listmonk"]
    environment:
      TZ: Europe/Zurich
      LISTMONK_app__address: "0.0.0.0:9000"
      LISTMONK_db__host: postgres
      LISTMONK_db__user: ${PG_USER}
      LISTMONK_db__password: ${PG_PASSWORD}
      LISTMONK_db__database: listmonk
      LISTMONK_db__ssl_mode: disable
      LISTMONK_ADMIN_USER: ${LISTMONK_API_USER}
      LISTMONK_ADMIN_PASSWORD: ${LISTMONK_ADMIN_PASSWORD}
    volumes:
      - listmonk_uploads:/listmonk/uploads
      - ./listmonk/config.toml:/listmonk/config.toml:ro
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }

  # ------------------------------------------------------------- Twenty CRM
  twenty:
    image: twentycrm/twenty:v0.32.0
    <<: *common
    environment:
      SERVER_URL: https://${MAIN_DOMAIN}
      PG_DATABASE_URL: postgres://${PG_USER}:${PG_PASSWORD}@postgres:5432/twenty
      REDIS_URL: redis://redis:6379
      APP_SECRET: ${TWENTY_APP_SECRET}
      STORAGE_TYPE: local
    volumes: [twenty_storage:/app/packages/twenty-server/.local-storage]
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }

  twenty-worker:
    image: twentycrm/twenty:v0.32.0
    <<: *common
    # Traitement asynchrone Twenty. Commande à aligner sur la release épinglée
    # (cf. docker-compose de Twenty v0.32) si elle change.
    command: ["yarn", "worker:prod"]
    environment:
      PG_DATABASE_URL: postgres://${PG_USER}:${PG_PASSWORD}@postgres:5432/twenty
      REDIS_URL: redis://redis:6379
      APP_SECRET: ${TWENTY_APP_SECRET}
      DISABLE_DB_MIGRATIONS: "true"
      STORAGE_TYPE: local
    volumes: [twenty_storage:/app/packages/twenty-server/.local-storage]
    networks: [internal]
    depends_on: [twenty]

  # ------------------------------------------------------------------- Kanboard
  kanboard:
    image: kanboard/kanboard:v1.2.42
    <<: *common
    environment:
      DATABASE_URL: postgres://${PG_USER}:${PG_PASSWORD}@postgres:5432/kanboard
    volumes:
      - kanboard_data:/var/www/app/data
      - kanboard_plugins:/var/www/app/plugins
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }

  # ------------------------------------------------- Génération + déploiement Pages
  sitegen:
    build: ./sitegen
    <<: *common
    environment:
      SITEGEN_TOKEN: ${SITEGEN_TOKEN}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID}
    networks: [internal]

  # ------------------------------------------------------------- Scraper (leads)
  scraper:
    build: ./scraper
    <<: *common
    environment:
      SCRAPER_TOKEN: ${SCRAPER_TOKEN}
    shm_size: "1gb"
    networks: [internal]

  # LLM = endpoint externe NVIDIA (nvidia/nemotron-3-ultra-550b-a55b) — plus d'Ollama.
  # NVIDIA_API_KEY est lue depuis OCI Vault au boot (voir docs/architecture.md).
