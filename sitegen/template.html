<!doctype html>
<html lang="__LANG__">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__TITLE__</title>
  <meta name="description" content="__META_DESC__">
  <meta name="robots" content="__ROBOTS__">
  <meta property="og:title" content="__TITLE__">
  <meta property="og:description" content="__META_DESC__">
  <style>
    :root { --bg:#0f1115; --card:#161a22; --fg:#e9edf5; --muted:#9aa4b2; --accent:#c8a24a; }
    * { box-sizing:border-box; margin:0; }
    body { font:16px/1.6 -apple-system,Segoe UI,Roboto,"Noto Sans JP",sans-serif;
           color:var(--fg); background:var(--bg); }
    .wrap { max-width:880px; margin:0 auto; padding:0 24px; }
    header { padding:88px 0 40px; text-align:center; }
    h1 { font-size:clamp(30px,5vw,52px); line-height:1.15; letter-spacing:-.01em; }
    .sub { color:var(--muted); font-size:clamp(17px,2.4vw,21px); margin-top:16px; }
    .cta { display:inline-block; margin-top:32px; padding:14px 28px; border-radius:10px;
           background:var(--accent); color:#161a22; font-weight:700; text-decoration:none; }
    section { padding:28px 0; border-top:1px solid #232838; }
    h2 { font-size:clamp(20px,3vw,26px); margin-bottom:10px; }
    p { color:#cdd4de; }
    footer { padding:48px 0; color:var(--muted); font-size:14px; text-align:center; }
    .card { background:var(--card); border:1px solid #232838; border-radius:16px;
            padding:28px; margin:28px 0; }
  </style>
</head>
<body>
  __WATERMARK__
  <div class="wrap">
    <header>
      <h1>__H1__</h1>
      <p class="sub">__HERO__</p>
      __CTA__
    </header>
    <main>__SECTIONS__</main>
    <footer>__FOOTER__</footer>
  </div>
</body>
</html>
