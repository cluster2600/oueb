<!doctype html>
<html lang="__LANG__">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>__TITLE__</title>
  <meta name="description" content="__META_DESC__">
  <meta name="robots" content="__ROBOTS__">
  <meta name="theme-color" content="__THEME_COLOR__">
  <meta property="og:title" content="__TITLE__">
  <meta property="og:description" content="__META_DESC__">
  <meta property="og:type" content="website">
  __OG_IMAGE__
  <script type="application/ld+json">__JSON_LD__</script>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap");
    :root {
      --brand:#17324d;
      --brand-dark:#0d1d2c;
      --accent:#e8b44c;
      --surface:#f5f0e8;
      --paper:#fffdf8;
      --ink:#171914;
      --muted:#62665f;
      --line:rgba(23,25,20,.18);
      --on-brand:#fff;
      --on-accent:#171914;
      --display:"Fraunces",Georgia,serif;
      --sans:"DM Sans",Arial,sans-serif;
      --mono:"Space Mono",monospace;
      --radius:0;
      --shadow:0 22px 70px rgba(15,20,18,.14);
      --max:1180px;
    }
    __THEME__
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--sans);line-height:1.65}
    img{display:block;max-width:100%}
    a{color:inherit}
    button,a{touch-action:manipulation}
    .skip{position:absolute;left:-999px;top:8px;z-index:99;background:var(--ink);color:#fff;padding:.7rem 1rem}
    .skip:focus{left:8px}
    .shell{width:min(calc(100% - 40px),var(--max));margin-inline:auto}
    .eyebrow{margin:0 0 .85rem;font-family:var(--mono);font-size:.72rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase}
    .eyebrow::before{content:"";display:inline-block;width:2.5rem;height:2px;margin:0 .65rem .25rem 0;background:currentColor}
    h1,h2,h3,p{margin-top:0}
    h1,h2{font-family:var(--display);font-weight:650;line-height:.98;letter-spacing:-.035em}
    h1{font-size:clamp(3rem,7vw,7.1rem);max-width:12ch;margin-bottom:1.6rem}
    h2{font-size:clamp(2.35rem,4.5vw,4.9rem);max-width:12ch}
    .lead{font-size:clamp(1.05rem,1.6vw,1.3rem);max-width:58ch;color:var(--muted)}
    .button{display:inline-flex;align-items:center;justify-content:center;gap:.7rem;min-height:48px;padding:.8rem 1.1rem;border:1px solid var(--ink);background:var(--ink);color:#fff;text-decoration:none;font-weight:700;transition:transform .2s,background .2s,color .2s}
    .button::after{content:"↗";font-family:var(--mono)}
    .button:hover{transform:translateY(-2px);background:transparent;color:var(--ink)}
    .button--light{border-color:var(--on-brand);background:var(--on-brand);color:var(--brand-dark)}
    .button--light:hover{color:var(--on-brand)}
    .site-header{position:relative;z-index:10;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(16px)}
    .site-header__inner{min-height:82px;display:flex;align-items:center;justify-content:space-between;gap:2rem}
    .brand{display:inline-flex;align-items:center;gap:.75rem;font-family:var(--display);font-size:1.35rem;font-weight:650;text-decoration:none;white-space:nowrap}
    .brand .wordmark{display:inline-block}
    .brand .mark{width:74px;height:auto;flex:none;overflow:visible}
    .brand .mark .bar{fill:var(--accent)}
    .brand .mark .line{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
    .nav{display:flex;align-items:center;justify-content:flex-end;gap:clamp(.9rem,2vw,2rem)}
    .nav a{font-size:.82rem;font-weight:700;text-decoration:none}
    .nav a:not(.nav__cta):hover{text-decoration:underline;text-underline-offset:.35rem}
    .nav__cta{padding:.58rem .8rem;border:1px solid currentColor}
    .hero{position:relative;overflow:hidden;padding:clamp(4.5rem,9vw,8rem) 0}
    .hero::before{content:"";position:absolute;inset:0 0 auto auto;width:min(38vw,520px);aspect-ratio:1;background:var(--accent);opacity:.22;border-radius:50%;filter:blur(2px);transform:translate(28%,-38%)}
    .hero__grid{position:relative;display:grid;grid-template-columns:minmax(0,1.12fr) minmax(280px,.88fr);gap:clamp(2.5rem,7vw,8rem);align-items:center}
    .hero__subtitle{font-size:clamp(1.1rem,2vw,1.45rem);max-width:38rem;color:var(--muted)}
    .hero__actions{display:flex;flex-wrap:wrap;align-items:center;gap:1rem;margin-top:2rem}
    .hero__note{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
    .hero__media{position:relative;min-height:clamp(390px,51vw,650px)}
    .hero__media::after{content:"";position:absolute;inset:8% -8% -8% 18%;border:1px solid var(--line);z-index:-1}
    .hero__media img{width:100%;height:100%;min-height:inherit;object-fit:cover;box-shadow:var(--shadow);filter:saturate(.86) contrast(1.03)}
    .hero__monogram{display:grid;place-items:center;width:100%;min-height:inherit;background:var(--brand);color:var(--on-brand);font-family:var(--display);font-size:clamp(8rem,22vw,18rem);line-height:1}
    .proof{border-block:1px solid var(--line);background:var(--paper)}
    .proof__grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr))}
    .proof__item{padding:1.7rem 1.4rem;border-right:1px solid var(--line)}
    .proof__item:last-child{border-right:0}
    .proof__value{display:block;font-family:var(--display);font-size:clamp(1.55rem,3vw,2.6rem);line-height:1.05}
    .proof__label{display:block;margin-top:.4rem;color:var(--muted);font-size:.83rem}
    .section{padding:clamp(5rem,10vw,9rem) 0}
    .section__intro{display:grid;grid-template-columns:.7fr 1.3fr;gap:clamp(2rem,7vw,7rem);margin-bottom:clamp(3rem,7vw,6rem)}
    .section__intro h2{margin:0}
    .services{background:var(--paper)}
    .service{display:grid;grid-template-columns:72px minmax(170px,.75fr) 1.25fr;gap:clamp(1.2rem,4vw,4rem);padding:2rem 0;border-top:1px solid var(--line)}
    .service:last-child{border-bottom:1px solid var(--line)}
    .service__number{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
    .service h3{font-family:var(--display);font-size:clamp(1.45rem,2.5vw,2.3rem);line-height:1.1}
    .service p{margin-bottom:0;color:var(--muted)}
    .story{overflow:hidden}
    .story__grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(2.5rem,8vw,8rem);align-items:center}
    .story__media{position:relative}
    .story__media img{width:100%;max-height:670px;object-fit:cover}
    .story__media::before{content:"";position:absolute;inset:-1.2rem 14% 1.2rem -1.2rem;background:var(--accent);z-index:-1}
    .story__copy blockquote{margin:2.2rem 0 0;padding:1.2rem 0 0;border-top:1px solid var(--line);font-family:var(--display);font-size:clamp(1.35rem,2.3vw,2.05rem);line-height:1.25}
    .partner{background:var(--brand);color:var(--on-brand)}
    .partner__grid{display:grid;grid-template-columns:.75fr 1.25fr;gap:clamp(2rem,8vw,8rem);align-items:center}
    .partner img{width:100%;max-height:420px;object-fit:cover}
    .partner .lead{color:color-mix(in srgb,var(--on-brand) 76%,transparent)}
    .gallery{background:var(--paper)}
    .gallery__grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
    .gallery__item{grid-column:span 4;margin:0;overflow:hidden;background:var(--surface)}
    .gallery__item:first-child{grid-column:span 7;grid-row:span 2}
    .gallery__item:nth-child(2),.gallery__item:nth-child(3){grid-column:span 5}
    .gallery__item img{width:100%;height:100%;min-height:270px;object-fit:cover;transition:transform .6s ease}
    .gallery__item:first-child img{min-height:552px}
    .gallery__item:hover img{transform:scale(1.025)}
    .gallery__item figcaption{padding:.65rem .8rem;font-size:.72rem;color:var(--muted)}
    .process__grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--line)}
    .step{padding:2rem clamp(1rem,3vw,2.5rem) 2rem 0;border-bottom:1px solid var(--line)}
    .step + .step{padding-left:clamp(1rem,3vw,2.5rem);border-left:1px solid var(--line)}
    .step__number{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
    .step h3{margin:1.4rem 0 .7rem;font-family:var(--display);font-size:1.7rem;line-height:1.15}
    .step p{margin:0;color:var(--muted)}
    .contact{background:var(--brand-dark);color:#fff}
    .contact__grid{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(2rem,8vw,8rem);align-items:start}
    .contact .eyebrow,.contact .lead{color:rgba(255,255,255,.72)}
    .contact h2{max-width:10ch}
    .contact__links{display:grid;gap:0;border-top:1px solid rgba(255,255,255,.25)}
    .contact__link{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1.2rem 0;border-bottom:1px solid rgba(255,255,255,.25);text-decoration:none;font-size:clamp(1rem,2vw,1.35rem)}
    .contact__link::after{content:"↗";font-family:var(--mono)}
    .contact__media{display:grid;gap:1rem}
    .contact__media img,.map{width:100%;min-height:240px;max-height:360px;object-fit:cover;border:0;background:#e6e6e6}
    .site-footer{background:var(--brand-dark);color:#fff;border-top:1px solid rgba(255,255,255,.16)}
    .site-footer__inner{min-height:110px;display:flex;align-items:center;justify-content:space-between;gap:2rem}
    .site-footer p{margin:0;color:rgba(255,255,255,.68);font-size:.78rem}
    .site-footer__links{display:flex;flex-wrap:wrap;gap:1rem;font-size:.78rem}
    .watermark{position:fixed;right:14px;bottom:14px;z-index:30;max-width:min(380px,calc(100vw - 28px));padding:.7rem .85rem;background:var(--ink);color:#fff;box-shadow:var(--shadow);font-size:.75rem}
    .watermark a{font-weight:700}
    .art-workshop{--display:"Manrope",Arial,sans-serif;--radius:0}
    .art-workshop h1,.art-workshop h2{text-transform:uppercase;font-weight:800;letter-spacing:-.055em}
    .art-workshop .hero__media{clip-path:polygon(7% 0,100% 0,100% 94%,0 100%,0 8%)}
    .art-editorial{--display:"Fraunces",Georgia,serif;--surface:#f4f0e9;--paper:#fffdfa}
    .art-editorial .site-header{border-top:4px solid var(--accent)}
    .art-editorial .hero__media img{border-radius:52% 52% 0 0}
    .art-precision{--display:"Manrope",Arial,sans-serif;--surface:#f2f6f6;--paper:#fff;--radius:2px}
    .art-precision h1,.art-precision h2{font-weight:500;letter-spacing:-.05em}
    .art-precision .hero__media::before{content:"+";position:absolute;left:-1rem;top:-2rem;font:700 3rem var(--mono);color:var(--accent)}
    .art-hospitality{--surface:#f4eee4;--paper:#fffaf2;--display:"Fraunces",Georgia,serif}
    .art-hospitality .hero{background:linear-gradient(115deg,var(--brand-dark) 0 54%,transparent 54%);color:#fff}
    .art-hospitality .hero__subtitle,.art-hospitality .hero__note{color:rgba(255,255,255,.72)}
    .art-hospitality .hero .button{border-color:#fff;background:#fff;color:var(--brand-dark)}
    @media(max-width:820px){
      .shell{width:min(calc(100% - 28px),var(--max))}
      .nav a:not(.nav__cta){display:none}
      .hero__grid,.section__intro,.story__grid,.partner__grid,.contact__grid{grid-template-columns:1fr}
      .hero__media{min-height:390px}
      .section__intro{gap:1rem}
      .service{grid-template-columns:44px 1fr}
      .service p{grid-column:2}
      .process__grid{grid-template-columns:1fr}
      .step + .step{padding-left:0;border-left:0}
      .gallery__item,.gallery__item:first-child,.gallery__item:nth-child(2),.gallery__item:nth-child(3){grid-column:span 6;grid-row:auto}
      .gallery__item img,.gallery__item:first-child img{min-height:320px}
      .art-hospitality .hero{background:var(--brand-dark)}
    }
    @media(max-width:520px){
      h1{font-size:clamp(2.8rem,16vw,4.5rem)}
      .site-header__inner{min-height:70px}
      .brand .mark{display:none}
      .hero{padding-top:3.5rem}
      .hero__actions{align-items:stretch;flex-direction:column}
      .button{width:100%}
      .proof__grid{grid-template-columns:1fr 1fr}
      .proof__item:nth-child(2n){border-right:0}
      .service{grid-template-columns:34px 1fr;gap:.7rem}
      .gallery__grid{display:block}
      .gallery__item{margin-bottom:12px}
      .gallery__item img,.gallery__item:first-child img{min-height:310px}
      .site-footer__inner{padding:1.6rem 0;align-items:flex-start;flex-direction:column}
    }
    @media(prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}
      *{animation-duration:.01ms!important;transition-duration:.01ms!important}
    }
  </style>
</head>

</body>
</html>
