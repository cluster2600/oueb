<!doctype html>
<html lang="__LANG__">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__TITLE__</title>
  <meta name="description" content="__META_DESC__">
  <meta name="robots" content="__ROBOTS__">
  <meta property="og:title" content="__TITLE__">
  <meta property="og:description" content="__META_DESC__">
  <meta property="og:type" content="website">
  __OG_IMAGE__
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=IBM+Plex+Mono:wght@500&display=swap">
  <style>
    :root{
      /* Palette d'atelier : béton peint, acier, ambre de baladeuse. */
      --ink:#14181D; --steel:#2B333C; --paper:#F2F3F1; --panel:#E6E9E6;
      --amber:#F0A81E; --oil:#5F6873; --line:#CFD4CF;
      --display:"Archivo",system-ui,sans-serif;
      --mono:"IBM Plex Mono",ui-monospace,monospace;
      --gut:clamp(20px,4vw,48px);
    }
    *,*::before,*::after{box-sizing:border-box}
    body,h1,h2,h3,p,figure,ul{margin:0}
    ul{padding:0;list-style:none}
    img{max-width:100%;display:block}
    html{-webkit-text-size-adjust:100%}
    body{
      font:400 17px/1.65 var(--display);
      color:var(--ink); background:var(--paper);
      text-rendering:optimizeLegibility;
    }
    .wrap{max-width:1180px;margin:0 auto;padding:0 var(--gut)}
    a{color:inherit}
    :focus-visible{outline:3px solid var(--amber);outline-offset:3px}

    /* Bande de danger : marquage d'atelier réel, seul ornement de la page. */
    .hazard{height:10px;background:repeating-linear-gradient(
      135deg,var(--amber) 0 16px,var(--ink) 16px 32px)}

    /* ---------------------------------------------------------------- nav */
    .nav{display:flex;align-items:center;justify-content:space-between;
         gap:16px;padding:20px 0;flex-wrap:wrap}
    .brand{font-weight:800;font-size:19px;letter-spacing:-.02em;
           text-decoration:none;display:flex;align-items:center;gap:10px}
    .brand::before{content:"";width:12px;height:12px;background:var(--amber);
                   border-radius:2px;flex:none}
    .navtel{font-family:var(--mono);font-size:15px;text-decoration:none;
            padding:10px 18px;border:2px solid var(--ink);border-radius:2px;
            font-weight:500;transition:background .15s,color .15s}
    .navtel:hover{background:var(--ink);color:var(--paper)}

    /* --------------------------------------------------------------- hero */
    .hero{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(24px,4vw,56px);
          align-items:center;padding:clamp(28px,5vw,64px) 0 clamp(36px,6vw,72px)}
    .eyebrow{font-family:var(--mono);font-size:13px;letter-spacing:.14em;
             text-transform:uppercase;color:var(--oil);margin-bottom:18px}
    .hero h1{font-size:clamp(38px,6.4vw,76px);font-weight:800;line-height:.98;
             letter-spacing:-.035em;text-wrap:balance}
    .hero .sub{font-size:clamp(17px,1.9vw,21px);color:var(--oil);
               margin-top:20px;max-width:46ch}
    /* Le téléphone est la signature typographique : appeler EST le but. */
    .telblock{margin-top:32px;display:inline-flex;flex-direction:column;
              text-decoration:none;border-left:6px solid var(--amber);
              padding-left:18px}
    .telblock .lbl{font-family:var(--mono);font-size:12px;letter-spacing:.16em;
                   text-transform:uppercase;color:var(--oil)}
    .telblock .num{font-family:var(--mono);font-weight:500;
                   font-size:clamp(26px,3.6vw,42px);letter-spacing:-.02em;
                   line-height:1.15;margin-top:4px}
    .telblock:hover .num{color:var(--amber)}
    .heromedia{position:relative;aspect-ratio:4/3;background:var(--panel);
               border-radius:3px;overflow:hidden}
    .heromedia img{width:100%;height:100%;object-fit:cover}
    .heromedia.empty{background:
      repeating-linear-gradient(135deg,var(--panel) 0 22px,var(--paper) 22px 44px)}

    /* ----------------------------------------------------------- sections */
    .sec{padding:clamp(44px,6vw,84px) 0}
    .sechead{display:flex;align-items:baseline;gap:16px;margin-bottom:32px;
             flex-wrap:wrap}
    .sechead h2{font-size:clamp(24px,3.2vw,38px);font-weight:800;
                letter-spacing:-.03em}
    .sechead .tag{font-family:var(--mono);font-size:12px;letter-spacing:.16em;
                  text-transform:uppercase;color:var(--oil)}

    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
          gap:2px;background:var(--line);border:1px solid var(--line)}
    .item{background:var(--paper);padding:28px 24px}
    .item svg{width:30px;height:30px;stroke:var(--amber);stroke-width:1.6;
              fill:none;margin-bottom:16px}
    .item h3{font-size:18px;font-weight:800;letter-spacing:-.01em;margin-bottom:8px}
    .item p{font-size:15.5px;color:var(--oil);line-height:1.6}

    .gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
             gap:12px}
    .gallery figure{aspect-ratio:3/2;overflow:hidden;border-radius:3px;
                    background:var(--panel)}
    .gallery img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
    .gallery figure:hover img{transform:scale(1.04)}

    /* ------------------------------------------------------------ contact */
    .contact{background:var(--ink);color:var(--paper)}
    .contact .sechead h2{color:var(--paper)}
    .contact .cols{display:grid;grid-template-columns:1fr 1.15fr;
                   gap:clamp(24px,4vw,48px);align-items:start}
    .facts{display:grid;gap:22px}
    .fact .k{font-family:var(--mono);font-size:12px;letter-spacing:.16em;
             text-transform:uppercase;color:var(--amber);margin-bottom:6px}
    .fact .v{font-size:17px;line-height:1.6}
    .fact a{text-decoration:none;border-bottom:1px solid rgba(242,243,241,.35)}
    .fact a:hover{border-color:var(--amber);color:var(--amber)}
    .hourlist{font-family:var(--mono);font-size:15px;display:grid;gap:4px}
    .hourlist span{display:flex;justify-content:space-between;gap:18px;
                   max-width:290px;border-bottom:1px dotted rgba(242,243,241,.2);
                   padding-bottom:3px}
    .map{aspect-ratio:4/3;border-radius:3px;overflow:hidden;background:var(--steel)}
    .map iframe{width:100%;height:100%;border:0;filter:grayscale(.25)}

    .cta{display:inline-block;margin-top:28px;padding:15px 30px;
         background:var(--amber);color:var(--ink);font-weight:800;
         text-decoration:none;border-radius:2px;letter-spacing:-.01em}
    .cta:hover{filter:brightness(1.07)}

    footer{padding:36px 0;font-family:var(--mono);font-size:13px;
           color:var(--oil);display:flex;justify-content:space-between;
           gap:14px;flex-wrap:wrap}

    @media (max-width:820px){
      .hero{grid-template-columns:1fr}
      .heromedia{order:-1;aspect-ratio:16/10}
      .contact .cols{grid-template-columns:1fr}
    }
    /* Révélation unique au chargement, désactivée si l'utilisateur la refuse. */
    @media (prefers-reduced-motion:no-preference){
      .rise{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
      .rise:nth-child(2){animation-delay:.06s}
      @keyframes rise{from{opacity:0;transform:translateY(14px)}}
    }
  </style>
</head>
<body>
  __WATERMARK__
  <div class="wrap">
    <nav class="nav">
      <a class="brand" href="#">__BRAND__</a>
      __NAVTEL__
    </nav>
  </div>
  <main>
    <div class="wrap">__HERO__</div>
    <div class="hazard"></div>
    __SERVICES__
    __GALLERY__
    __CONTACT__
  </main>
  <div class="wrap"><footer>__FOOTER__</footer></div>
</body>
</html>
